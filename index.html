<!doctype html>
<html lang="en-GB">
<head>

<title>You Died Again Games</title>
<style>
  :root { --bg: #fafaf7; --text: #1f2328; --muted: #5a6270; --accent: #2f7d4f; --line: #e3e3dc; }

    :root { --bg: #15181d; --text: #e6e8eb; --muted: #a0a8b4; --accent: #6cc58f; --line: #2a2f37; }
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 2.2em; line-height: 1.15; margin: 0 0 8px; }
  h2 { font-size: 1.4em; margin: 0 0 4px; }
  .tagline { color: var(--muted); margin: 0 0 2.5em; }
  .game { border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .game p { margin: 0.5em 0; }
  a { color: var(--accent); }
  footer { margin-top: 3em; color: var(--muted); font-size: 0.9em; }
</style>
</head>

<main>

  <p>Coming soon to Google Play.</p>
